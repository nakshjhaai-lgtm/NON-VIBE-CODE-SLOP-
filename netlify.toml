[build]
  # Everything deployed is checked in. This command intentionally uses no
  # package manager, compiler, Node runtime, Python runtime, or native module.
  command = "echo 'Using checked-in assets; no dependency install or compile step.'"
  publish = "public"
  edge_functions = "netlify/edge-functions"

[build.processing]
  skip_processing = true

# Keep checked-in assets on the CDN; every other path is rendered by the Edge
# application. Declaring the route here avoids any framework auto-detection.
[[edge_functions]]
  function = "app"
  path = "/*"
  excludedPath = ["/favicon.ico", "/css/*", "/fonts/*", "/img/*", "/js/*"]

# Edge-rendered responses set their complete policy in server/http/security.js.
# These rules add a security baseline to files served straight from the CDN.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Cross-Origin-Resource-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "font/woff2"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; style-src 'unsafe-inline'; sandbox"
